# LEGO Battles - ndsrecomp title configuration
#
# Every value here is read from the cartridge or from this project's own
# verified analysis; none of it is invented.
# Program configs live in config/ and are regenerated by tools/lb_ndsrecomp.py.

[game]
name     = "LEGO Battles"
id       = "C5SP"
region   = "Europe"
revision = 0
rom      = "LEGO Battles (Europe) (En,Fr,De,Es,It,Da).nds"
rom_size = 0x08000000
sha1     = "da60469bd143eb8f47ecf0d7951181b4783c91b4"
status   = "static lift configured; 10,019 entry points across 94 programs. Not yet lifted or run."

[display]
# Rendering style: Vanilla / Enhanced, Enhanced by default.
#
# LEGO Battles is an RTS and its GAME FIELD IS THE TOUCH SCREEN. That is the
# opposite of the Prime Hunters and SM64DS configurations, which widen the upper
# 3D viewport: here the lower screen is the one that must grow - the main game
# window is the touch screen, and it is clickable. ndsrecomp accepts none/top/bottom/both
# (NDS_ADAPTIVE_BOTTOM in runner/src/frontend_config.cpp), so "bottom" is a
# supported value and not a hopeful one.
# ONE WINDOW. The main game window is the touch screen, with the top screen
# as an overlay, so both modes live in a
# single window: Enhanced draws only the bottom screen and the overlay
# carries the top; DS Vanilla stacks them as melonDS does. Two windows
# would make the mode switch a window-recreation problem instead of a rect.
screen_layout       = "stacked"
adaptive_widescreen = "bottom"
adaptive_capability = "bottom"
# The widened width itself. Without this key the runner leaves
# adaptive_max_width at 256, so "adaptive_widescreen = bottom" is accepted,
# reported in the [sdl] banner, and then widens nothing -- which is how this
# looked like a broken widener rather than an unset width. 448 is the
# runner's own maximum (frontend_config.cpp rejects anything outside
# 256..448 or odd).
adaptive_width      = 512
# OBJ anchoring for the in-field HUD. OFF, and this was the reported "vertical
# striping". See docs/193.
#
# The framework keeps a centre band together and moves what is authored left of
# it to the left edge and right of it to the right edge. In Metroid Prime
# Hunters, where this setting was copied from, engine 0 is the TOP screen: a 3D
# world with a 2D HUD overlaid, so anchoring pins the HUD to the corners of a
# wider view and the world underneath is untouched.
#
# In LEGO Battles engine 0 is the BOTTOM screen and it is not a HUD overlay --
# it IS the battlefield. So anchoring cut the field itself into three pieces
# and pinned two of them to the edges, leaving holes where they had been.
# Measured on the presented surface, gameplay, 448 wide:
#
#   anchor on    lit 0..95 | BLACK 96..191 | lit 192..266 | BLACK 267..351 | lit 352..447
#   anchor off   BLACK 0..95 | lit 96..351 | BLACK 352..447
#
# 96 + 75 + 85 = 256: with anchoring on, the native view's own left and right
# slices are what fills the extras, and the black is the hole they left. The
# ground texture gives it away -- the flowers in the widened columns are the
# same flowers, moved.
#
# Turning this off does not place the in-field HUD; nothing does yet. OBJ is
# disabled outright in gameplay (DISPCNT 00010F08, bit 12 clear), so this key
# could never have moved those buttons in the first place -- it only ever had
# the BG bands to act on, which are the field.
adaptive_hud_anchor = false
# Framework default. Unused while the anchor is off, kept so the value does not
# have to be rediscovered if the anchor is ever applied to a real HUD layer.
adaptive_hud_center_width = 64
supersampling       = 1
antialiasing        = 0

# WHY WIDENING IS SAFE HERE, which is not a general property of DS titles.
# docs/85 established from two independent directions that the simulation never
# calls view code: zero Sim->User edges across 555 simulation virtuals, and of
# the 95 targets the address-region test flagged, none belongs to a User:: class.
# The cartridge argues it too - LEGO Battles shipped wireless multiplayer where
# two players scroll independently, so a view-fed simulation would already
# desync every match.
#
# CONSEQUENCE: field of view is CLIENT-LOCAL. A widescreen host and a Vanilla
# client stay in lockstep, so this is not a lobby-carried option, unlike the
# multiplayer caps and rule toggles.
#
# The real constraint is draw budget, not correctness. Showing more of the map
# means more entities and tiles on screen than the DS ever drew at once; that
# can be slow, but it cannot diverge.

[vanilla]
# BOTH paths are required, not just the enhanced one: vanilla enforces the
# DS-style single-window top-screen and bottom-screen structure, whose scale
# does not change with window size. Selecting this profile must pin the layout
# to the DS's own geometry regardless of window size.
screen_layout       = "stacked"
adaptive_widescreen = "none"
lock_native_scale   = true

[timing]
# docs/25: the simulation is deterministic lockstep at 30 Hz. The host may
# present at any rate, but the guest tick must not be rescaled or multiplayer
# and replays diverge.
guest_tick_hz = 30

[program]
# 94 program configs in config/. The ARM7 mainram autoload at 0x027E0000
# (96,376 bytes, autoload entry 1) was listed here as "deliberately absent: the
# corpus has no entry points there". The first half of that is now false and
# the second half is still true, which is exactly how it misled.
#
#   out/eur/arm7_corpus.tsv    still has ZERO rows in 0x027E0000..0x027F8000
#   port/config/lb_arm7_mainram.toml  exists anyway, with 153 [[entry_point]]
#                              blocks and authoritative_entry_points = true
#   port/lift.sh:76            lifts it
#   port/generated/lb_arm7_mainram_dispatch.c   6387 dispatch entries
#   build/title_bank_registry.cpp:202           nds_register_dispatch(NDS_ARM7,
#                              g_dispatch_lb_arm7_mainram, ...)
#
# So the section is COVERED, and time was spent chasing a 41.9% coverage
# gap that had already been closed. (tools/lb_ndsrecomp.py still prints "NOT
# EMITTED: ARM7 mainram" and did not write that config; where its entry points
# came from is not recorded here, only that they are lifted and registered.)
#
# NOTHING READS THIS LIST. port/lift.sh names each config file directly and the
# runner's CMake globs port/generated/*_dispatch.c, so a name missing from here
# does not drop a bank -- which is exactly why the error survived. It is kept
# accurate because it is read by people.
arm9  = "config/lb_arm9.toml"
arm7  = ["config/lb_arm7_static.toml", "config/lb_arm7_wram.toml",
         "config/lb_arm7_mainram.toml"]

# All 91 overlays load at the SAME address, 0x0216A2E0 (docs/39). They are
# alternatives, never resident together, so each is its own program and they
# must not be lifted into one address space.
overlay_base  = 0x0216A2E0
overlay_count = 91
overlay_glob  = "config/lb_ov*.toml"

[cartridge]
# SAVE CHIP: EEPROM 4 Kbit, 512 bytes ("eeprom-tiny").
#
# Established from the game's own SPI traffic, which is the only signal that
# distinguishes the candidates. The ROM declares nothing usable: the
# [SDK+NINTENDO:BACKUP] marker at 0x02000BEC is followed by NUL padding, not a
# type string.
#
# Tracing the AUXSPI commands (port/runner/apply_hooks.py adds LB_TRACE_SAVE)
# shows the game issuing:
#
#     0x05 RDSR x12    0x03 READ x3    0x0B READ-HIGH x1    0x01 WRSR x1
#
# **0x0B settles it.** On a 4 Kbit EEPROM the ninth address bit is encoded in
# the command itself - 0x03/0x0B to read the low/high 256 bytes, 0x02/0x0A to
# write them. Only the eeprom-tiny path implements that pair; the plain eeprom
# path has no case for 0x0B and falls through to "return 0xFF", so the game
# reads nothing but 0xFF and reports
#     "The LEGO Battles data could not be accessed."
#
# Result with this setting: 494 of 512 bytes written, header FE_BATTLE_SAVES at
# offset 0, and executed coverage moves 107 -> 108 pages, the first time that
# number has changed under ANY save configuration.
#
# A PREVIOUS VERSION OF THIS FILE SAID eeprom/65536, AND THAT WAS WRONG. It was
# chosen because it was the only size whose save contained a readable header,
# but the header sat at 0x41 rather than 0x40 and the game still failed. A
# plausible-looking artefact of a wrong chip is not evidence of a right one;
# the command trace is.
save_type = "eeprom-tiny"
save_size = 512
